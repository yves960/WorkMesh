[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cptr-bridge"
version = "0.1.0"
description = "Skeleton OpenAPI tool server bridging WorkMesh AICP read-only agent tools for cptr (Open WebUI Computer)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "requests>=2.31",
]

[project.scripts]
cptr-bridge = "cptr_bridge.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cptr_bridge = ["openapi.json", "templates/*.html"]
