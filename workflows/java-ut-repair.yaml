name: java-ut-repair
version: 2
description: 修复 Java 单元测试失败

triggers:
  - on_user_message:
      keywords_any: ["UT", "test", "挂了", "fail", "失败"]
  - on_issue_status_change:
      from: ["TODO"]
      to: ["READY_FOR_AI"]
      issue_type: ["test_failure"]

# v2 数据流修正（loader 前向引用检查驱动）：
# discovery 打头产出 failure_summary / failing_tests / recommended_*，
# knowledge 与 context 只做后向引用；v1 的 knowledge→context→discovery 乱序已废。
steps:
  - id: discovery
    type: discovery
    inputs: {workspace_root: "{{trigger.project_path}}", user_message: "UT 挂了，帮我修"}
    timeout_seconds: 60
  - id: knowledge
    type: knowledge
    inputs: {query: "{{discovery.failure_summary}}", max_results: 5}
    timeout_seconds: 30
  - id: context
    type: context
    inputs: {include: ["trigger.user_message", "discovery.failure_summary"]}
    timeout_seconds: 5
  - id: issue
    type: issue
    inputs: {title_template: "修复 {{discovery.failing_tests[0]}}", create_if_missing: true}
    timeout_seconds: 10
  - id: approval
    type: approval
    inputs: {plan_template: "Project: {{trigger.project_path}}\nProfile: {{discovery.recommended_profile}}\nTarget: {{discovery.recommended_target}}"}
    timeout_seconds: 300
  - id: forgeloop
    type: forgeloop
    inputs: {project_path: "{{trigger.project_path}}", profile: "{{discovery.recommended_profile}}", target: "{{discovery.recommended_target}}", issue_ref: "{{issue.issue_id}}"}
    requires_approval: true
    timeout_seconds: 600
  - id: sync_multica
    type: sync_multica
    inputs: {issue_id: "{{issue.issue_id}}", status_map: {pass: "REVIEW", fail: "FAILED"}}
    timeout_seconds: 10
  - id: notify
    type: notify
    inputs: {channel: "feishu", template: "✅ Workflow {{workflow.name}} 完成"}
    timeout_seconds: 10
